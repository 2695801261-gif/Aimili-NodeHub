mixed-port: 7890
allow-lan: false
mode: rule
log-level: info
ipv6: true
profile:
  store-selected: true
geodata-mode: true
geodata-loader: memconservative
geo-auto-update: true
geo-update-interval: 24
proxy-groups:
- name: 🚀 Auto
  type: url-test
  use:
  - kooker
  - radikal
  - shaoyouvip
  - ts-sf-clash
  - wzmwayne
  url: https://www.gstatic.com/generate_204
  interval: 600
  tolerance: 150
  lazy: true
  timeout: 5000
  expected-status: 204
- name: 🌍 Proxy
  type: select
  proxies:
  - 🚀 Auto
  - DIRECT
  use:
  - kooker
  - radikal
  - shaoyouvip
  - ts-sf-clash
  - wzmwayne
- name: 🇨🇳 Mainland China
  type: select
  proxies:
  - DIRECT
  - 🌍 Proxy
- name: 🚫 AdBlock
  type: select
  proxies:
  - REJECT
  - DIRECT
  - 🌍 Proxy
- name: 🤖 AI
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 🎬 Media
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
- name: 💬 Messaging
  type: select
  proxies:
  - 🌍 Proxy
  - DIRECT
rules:
- GEOSITE,private,DIRECT
- GEOIP,private,DIRECT,no-resolve
- GEOSITE,category-ai-!cn,🤖 AI
- GEOSITE,youtube,🎬 Media
- GEOSITE,netflix,🎬 Media
- GEOSITE,telegram,💬 Messaging
- GEOSITE,category-ads-all,🚫 AdBlock
- DOMAIN,cm.bilibili.com,🚫 AdBlock
- DOMAIN,data.bilibili.com,🚫 AdBlock
- DOMAIN,live-trace.bilibili.com,🚫 AdBlock
- DOMAIN-SUFFIX,tanx.com,🚫 AdBlock
- DOMAIN-SUFFIX,simba.taobao.com,🚫 AdBlock
- DOMAIN-SUFFIX,mmstat.com,🚫 AdBlock
- DOMAIN-SUFFIX,cnzz.com,🚫 AdBlock
- DOMAIN-SUFFIX,miaozhen.com,🚫 AdBlock
- GEOSITE,cn,🇨🇳 Mainland China
- GEOIP,CN,🇨🇳 Mainland China,no-resolve
- MATCH,🌍 Proxy
proxy-providers:
  kooker:
    type: http
    url: https://raw.githubusercontent.com/2695801261-gif/Aimili-NodeHub/HEAD/nodes/kooker.yaml
    path: ./proxy_providers/kooker.yaml
    interval: 3600
  radikal:
    type: http
    url: https://raw.githubusercontent.com/2695801261-gif/Aimili-NodeHub/HEAD/nodes/radikal.yaml
    path: ./proxy_providers/radikal.yaml
    interval: 3600
  shaoyouvip:
    type: http
    url: https://raw.githubusercontent.com/2695801261-gif/Aimili-NodeHub/HEAD/nodes/shaoyouvip.yaml
    path: ./proxy_providers/shaoyouvip.yaml
    interval: 3600
  ts-sf-clash:
    type: http
    url: https://raw.githubusercontent.com/2695801261-gif/Aimili-NodeHub/HEAD/nodes/ts-sf-clash.yaml
    path: ./proxy_providers/ts-sf-clash.yaml
    interval: 3600
  wzmwayne:
    type: http
    url: https://raw.githubusercontent.com/2695801261-gif/Aimili-NodeHub/HEAD/nodes/wzmwayne.yaml
    path: ./proxy_providers/wzmwayne.yaml
    interval: 3600
