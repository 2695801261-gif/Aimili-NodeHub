name: Collect and verify nodes

on:
  push:
    branches: [main]
    paths-ignore:
      - "nodes/**"
      - "subscriptions/**"
      - "classification/**"
      - "README.md"
      - "docs/**"
      - "upstream.lock.json"
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: aimili-nodehub-collection
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NodeHub
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Fetch pinned FreeNodes engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nostalume/FreeNodes.git "$RUNNER_TEMP/FreeNodes"
          git -C "$RUNNER_TEMP/FreeNodes" checkout 5a4f4ecf8c06b49b503046179d10933a6a63ef69
          cp -a "$RUNNER_TEMP/FreeNodes/freenodes" .
          cp "$RUNNER_TEMP/FreeNodes/main.py" .
          cp "$RUNNER_TEMP/FreeNodes/config.yaml" .
          cp "$RUNNER_TEMP/FreeNodes/pyproject.toml" .
          cp "$RUNNER_TEMP/FreeNodes/uv.lock" .
          cp "$RUNNER_TEMP/FreeNodes/mihomo-lock.json" .
          mkdir -p nodes

      - name: Configure publication identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("config.yaml")
          s = p.read_text(encoding="utf-8")
          old = "repository:\n  owner: nostalume\n  name: FreeNodes"
          new = "repository:\n  owner: 2695801261-gif\n  name: Aimili-NodeHub"
          if old not in s:
              raise SystemExit("Pinned upstream config layout changed; refusing unsafe publication")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies and browser
        run: |
          uv sync --locked --extra youtube
          uv run playwright install --with-deps chromium

      - name: Run classification unit tests
        run: uv run --locked pytest -q tests/test_classification.py

      - name: Discover, validate and generate profiles
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked --extra youtube python main.py

      - name: Classify verified proxy exits
        continue-on-error: true
        run: uv run --locked python -m scripts.classify_exits

      - name: Check generated profiles
        shell: bash
        run: |
          set -euo pipefail
          test -s nodes/merged.yaml
          test -s nodes/v2ray.txt
          test -s nodes/publication-receipt.json
          if [ -f classification/evidence.json ]; then
            test -s subscriptions/us-residential.yaml
            test -s subscriptions/other-residential.yaml
            test -s subscriptions/low-risk-datacenter.yaml
          fi

      - name: Commit changed subscriptions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes/
          if [ -d subscriptions ]; then git add subscriptions/; fi
          if [ -f classification/evidence.json ]; then git add classification/evidence.json; fi
          if git diff --cached --quiet; then
            echo "No subscription changes."
          else
            git commit -m "auto: update verified nodes and classified pools"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                conflicts="$(git diff --name-only --diff-filter=U)"
                if [ -z "$conflicts" ]; then exit 1; fi
                while IFS= read -r path; do
                  git checkout --theirs -- "$path"
                  git add -- "$path"
                done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue
              fi
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
