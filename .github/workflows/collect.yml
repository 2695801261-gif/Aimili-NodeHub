name: Collect and verify nodes

on:
  push:
    branches: [main]
    paths-ignore:
      - "nodes/**"
      - "subscriptions/**"
      - "classification/**"
      - "README.md"
      - "docs/**"
      - "upstream.lock.json"
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: aimili-nodehub-collection
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NodeHub
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Fetch pinned FreeNodes engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nostalume/FreeNodes.git "$RUNNER_TEMP/FreeNodes"
          git -C "$RUNNER_TEMP/FreeNodes" checkout 5a4f4ecf8c06b49b503046179d10933a6a63ef69
          cp -a "$RUNNER_TEMP/FreeNodes/freenodes" .
          cp "$RUNNER_TEMP/FreeNodes/main.py" .
          cp "$RUNNER_TEMP/FreeNodes/config.yaml" .
          cp "$RUNNER_TEMP/FreeNodes/pyproject.toml" .
          cp "$RUNNER_TEMP/FreeNodes/uv.lock" .
          cp "$RUNNER_TEMP/FreeNodes/mihomo-lock.json" .
          mkdir -p nodes

      - name: Configure publication identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("config.yaml")
          s = p.read_text(encoding="utf-8")
          old = "repository:\n  owner: nostalume\n  name: FreeNodes"
          new = "repository:\n  owner: 2695801261-gif\n  name: Aimili-NodeHub"
          if old not in s:
              raise SystemExit("Pinned upstream config layout changed; refusing unsafe publication")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Limit discovery to maintained direct subscription sources
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          from pathlib import Path
          import yaml

          path = Path("config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          for section in ("sources", "audit_sources"):
              entries = config.get(section, [])
              config[section] = [
                  item for item in entries
                  if item.get("kind") == "github_file"
              ]
          if len(config.get("sources", [])) < 3:
              raise SystemExit("Fewer than three direct GitHub subscription sources; refusing reduced discovery")
          path.write_text(
              yaml.safe_dump(config, allow_unicode=True, sort_keys=False),
              encoding="utf-8",
          )
          print("Active direct GitHub sources:", len(config["sources"]))
          PY

      - name: Run classification unit tests
        run: uv run --locked pytest -q tests/test_classification.py

      - name: Discover, validate and generate profiles
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
        run: uv run --locked python main.py

      - name: Classify verified proxy exits
        timeout-minutes: 30
        env:
          NODEHUB_MAX_EXIT_PROBES: "25"
        run: uv run --locked python -m scripts.classify_exits

      - name: Check generated profiles
        shell: bash
        run: |
          set -euo pipefail
          test -s nodes/merged.yaml
          test -s nodes/v2ray.txt
          test -s nodes/publication-receipt.json
          test -s classification/evidence.json
          test -s subscriptions/us-residential.yaml
          test -s subscriptions/other-residential.yaml
          test -s subscriptions/low-risk-datacenter.yaml
          uv run --locked python - <<'PY'
          import json
          from pathlib import Path
          import yaml

          pools = {
              "us-residential": Path("subscriptions/us-residential.yaml"),
              "other-residential": Path("subscriptions/other-residential.yaml"),
              "low-risk-datacenter": Path("subscriptions/low-risk-datacenter.yaml"),
          }
          evidence = json.loads(Path("classification/evidence.json").read_text(encoding="utf-8"))
          seen = set()
          actual_sizes = {}
          for pool, path in pools.items():
              profile = yaml.safe_load(path.read_text(encoding="utf-8"))
              proxies = profile.get("proxies") if isinstance(profile, dict) else None
              if not isinstance(proxies, list) or not proxies:
                  raise SystemExit(f"Publication blocked: {pool} contains no verified proxies")
              names = [item.get("name") for item in proxies if isinstance(item, dict)]
              if len(names) != len(proxies) or any(not isinstance(name, str) or not name for name in names):
                  raise SystemExit(f"Publication blocked: {pool} contains malformed proxy entries")
              if len(names) != len(set(names)):
                  raise SystemExit(f"Publication blocked: {pool} contains duplicate proxy names")
              overlap = seen.intersection(names)
              if overlap:
                  raise SystemExit(f"Publication blocked: proxies appear in multiple pools: {sorted(overlap)[:5]}")
              seen.update(names)
              groups = profile.get("proxy-groups")
              if not isinstance(groups, list) or not groups:
                  raise SystemExit(f"Publication blocked: {pool} has no proxy group")
              group_proxy_names = {
                  name
                  for group in groups if isinstance(group, dict)
                  for name in (group.get("proxies") or [])
                  if isinstance(name, str)
              }
              if not set(names).issubset(group_proxy_names):
                  raise SystemExit(f"Publication blocked: {pool} proxy group references are incomplete")
              actual_sizes[pool] = len(proxies)

          reported_sizes = evidence.get("pool_sizes")
          if not isinstance(reported_sizes, dict):
              raise SystemExit("Publication blocked: evidence report has no pool_sizes")
          for pool, count in actual_sizes.items():
              if reported_sizes.get(pool) != count:
                  raise SystemExit(
                      f"Publication blocked: {pool} evidence count "
                      f"{reported_sizes.get(pool)!r} does not match profile count {count}"
                  )
          print("Publication gate passed:", json.dumps(actual_sizes, sort_keys=True))
          PY

      - name: Commit changed subscriptions
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add nodes/
          if [ -d subscriptions ]; then git add subscriptions/; fi
          if [ -f classification/evidence.json ]; then git add classification/evidence.json; fi
          if git diff --cached --quiet; then
            echo "No subscription changes."
          else
            git commit -m "auto: update verified nodes and classified pools"
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                conflicts="$(git diff --name-only --diff-filter=U)"
                if [ -z "$conflicts" ]; then exit 1; fi
                while IFS= read -r path; do
                  if git cat-file -e "REBASE_HEAD:$path" 2>/dev/null; then
                    git checkout --theirs -- "$path"
                    git add -- "$path"
                  else
                    git rm -f -- "$path"
                  fi
                done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue
              fi
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
