name: Collect and verify nodes

on:
  push:
    branches: [main]
    paths-ignore:
      - "nodes/**"
      - "subscriptions/**"
      - "classification/**"
      - "README.md"
      - "docs/**"
      - "upstream.lock.json"
  workflow_dispatch:
  schedule:
    - cron: "23 */6 * * *"

concurrency:
  group: aimili-nodehub-collection
  # A newer code push supersedes an older, potentially slow collection run.
  cancel-in-progress: true

permissions:
  contents: write

jobs:
  collect:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: Checkout NodeHub
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Install uv
        uses: astral-sh/setup-uv@c771a70e6277c0a99b617c7a806ffedaca235ff9 # v9.0.0
        with:
          version: "0.12.0"
          enable-cache: true

      - name: Fetch pinned FreeNodes engine
        shell: bash
        run: |
          set -euo pipefail
          git clone --filter=blob:none https://github.com/nostalume/FreeNodes.git "$RUNNER_TEMP/FreeNodes"
          git -C "$RUNNER_TEMP/FreeNodes" checkout 5a4f4ecf8c06b49b503046179d10933a6a63ef69
          cp -a "$RUNNER_TEMP/FreeNodes/freenodes" .
          cp "$RUNNER_TEMP/FreeNodes/main.py" .
          cp "$RUNNER_TEMP/FreeNodes/config.yaml" .
          cp "$RUNNER_TEMP/FreeNodes/pyproject.toml" .
          cp "$RUNNER_TEMP/FreeNodes/uv.lock" .
          cp "$RUNNER_TEMP/FreeNodes/mihomo-lock.json" .
          mkdir -p nodes

      - name: Configure publication identity
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path("config.yaml")
          s = p.read_text(encoding="utf-8")
          old = "repository:\n  owner: nostalume\n  name: FreeNodes"
          new = "repository:\n  owner: 2695801261-gif\n  name: Aimili-NodeHub"
          if old not in s:
              raise SystemExit("Pinned upstream config layout changed; refusing unsafe publication")
          p.write_text(s.replace(old, new, 1), encoding="utf-8")
          PY

      - name: Install dependencies
        run: |
          uv sync --locked

      - name: Restore recent VPNGate candidate snapshots
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vpngate/candidate-history.json
          key: vpngate-candidates-main-${{ github.run_id }}
          restore-keys: |
            vpngate-candidates-main-

      - name: Enable all pinned FreeNodes discovery adapters
        shell: bash
        run: |
          set -euo pipefail
          uv run --locked python - <<'PY'
          from collections import Counter
          from pathlib import Path
          import yaml

          path = Path("config.yaml")
          config = yaml.safe_load(path.read_text(encoding="utf-8"))
          sources = config.get("sources", [])
          if not sources:
              raise SystemExit("No active discovery sources are configured")
          kinds = Counter(item.get("kind", "unknown") for item in sources)
          supported = {"github_file", "web", "password_page", "youtube_resources"}
          unknown = sorted(set(kinds) - supported)
          if unknown:
              raise SystemExit("Unsupported pinned source kinds: " + ", ".join(unknown))
          print("Active pinned discovery sources:", len(sources))
          for kind, count in sorted(kinds.items()):
              print(f"  {kind}: {count}")
          print("Reserve-only audit sources remain inactive by design.")
          PY

      - name: Run classification and publication-gate unit tests
        run: uv run --locked pytest -q tests/test_classification.py tests/test_publication.py tests/test_diagnostics.py tests/test_classify_exits.py tests/test_nodehub.py tests/test_vpngate.py tests/test_vpnbook.py tests/test_snapshot_vpngate.py

      - name: Build, classify and publish the NodeHub module
        id: classify
        timeout-minutes: 55
        env:
          GH_TOKEN: ${{ github.token }}
          OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
          IPAPI_IS_API_KEY: ${{ secrets.IPAPI_IS_API_KEY }}
          NODEHUB_CF_FRONT_URI: ${{ secrets.NODEHUB_CF_FRONT_URI }}
          NODEHUB_MAX_EXIT_PROBES: "80"
        run: uv run --locked python -m scripts.nodehub

      - name: Save refreshed VPNGate candidate history
        if: always() && !cancelled() && hashFiles('.cache/vpngate/candidate-history.json') != ''
        uses: actions/cache/save@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .cache/vpngate/candidate-history.json
          key: vpngate-candidates-main-${{ github.run_id }}

      - name: Publish failure diagnostics to job summary
        if: always()
        shell: bash
        run: |
          if [ -s classification/diagnostics.json ]; then
            echo "## NodeHub classification diagnostics" >> "$GITHUB_STEP_SUMMARY"
            python -c 'import json; from pathlib import Path; d=json.loads(Path("classification/diagnostics.json").read_text()); print("| Metric | Count |"); print("|---|---:|"); [print(f"| {k} | {d.get(k, 0)} |") for k in ("checked", "accepted", "quarantined")]; print(); print("### Rejection reasons"); [print(f"- `{k}`: {v}") for k, v in d.get("reason_counts", {}).items()]; print(); print("### Provider states"); [print(f"- **{k}**: " + ", ".join(f"{a}={b}" for a, b in v.items())) for k, v in d.get("provider_status_counts", {}).items()]' >> "$GITHUB_STEP_SUMMARY"
          else
            echo "No classification diagnostics were produced." >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Commit generated artifacts and failure diagnostics
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          if [ "${{ steps.classify.outcome }}" = "success" ]; then
            for path in nodes subscriptions classification; do
              if [ -d "$path" ]; then git add "$path/"; fi
            done
          else
            # Failed verification may publish diagnostics only. Never advance
            # candidate snapshots or subscription pools from a failed run.
            if [ -d classification ]; then git add classification/; fi
          fi
          if git diff --cached --quiet; then
            echo "No generated artifacts to commit."
          else
            if [ "${{ steps.classify.outcome }}" = "success" ]; then
              git commit -m "auto: update verified nodes and classified pools"
            else
              git commit -m "ci: preserve failed-run classification diagnostics"
            fi
            if [ "${{ steps.classify.outcome }}" != "success" ]; then
              # Discard generated candidate/subscription worktree changes that
              # were intentionally excluded from the failed-run diagnostics commit.
              git restore --source=HEAD --staged --worktree -- nodes subscriptions
              git clean -fd -- nodes subscriptions
            fi
            for attempt in 1 2 3; do
              git fetch origin main
              if ! git rebase origin/main; then
                conflicts="$(git diff --name-only --diff-filter=U)"
                if [ -z "$conflicts" ]; then exit 1; fi
                while IFS= read -r path; do
                  if git cat-file -e "REBASE_HEAD:$path" 2>/dev/null; then
                    git checkout --theirs -- "$path"
                    git add -- "$path"
                  else
                    git rm -f -- "$path"
                  fi
                done <<< "$conflicts"
                GIT_EDITOR=true git rebase --continue
              fi
              if git push; then
                break
              fi
              if [ "$attempt" -eq 3 ]; then exit 1; fi
            done
          fi
